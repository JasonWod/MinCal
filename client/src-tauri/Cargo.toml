[package]
name = "mincal"
version = "0.1.5"
description = "MinCal - Team Calendar Sync"
authors = ["onyx"]
edition = "2021"

[lib]
name = "mincal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 生产构建必须开启此 feature：否则 tauri 的 build.rs 会令 dev=true，
# exe 运行时去连 devUrl(http://127.0.0.1:25173) 而不使用内嵌资源 → "localhost 拒绝连接"。
# `tauri build` 会自动加上；用裸 cargo build 时必须显式 --features custom-protocol。
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon" ] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = [ "tray-icon", "devtools" ] }
winreg = "0.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
