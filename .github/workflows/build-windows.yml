name: Build MinCal Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install frontend deps
        working-directory: client
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        working-directory: client
        run: npx tsc --noEmit
      - name: Unit tests (vitest)
        working-directory: client
        run: npm test

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt pytest httpx
      - name: Security & contract tests (pytest)
        working-directory: backend
        run: python -m pytest -q

  build-windows:
    needs: [test-client, test-backend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install WebKit dependency (Windows has WebView2 built-in)
        run: echo "Windows 10/11 includes WebView2 Evergreen by default"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Build Tauri app
        working-directory: client
        run: npx tauri build

      - name: 防呆校验（禁止开发模式/错配产物发布）
        working-directory: client
        shell: pwsh
        run: |
          $exe = "src-tauri\target\release\mincal.exe"
          $text = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          # 判据说明：只有开启 custom-protocol 的生产构建才会把前端资源打进 exe。
          # 开发模式产物里没有资产清单 → 用户双击会去连开发服务器而报「拒绝连接」。
          if ($text -notmatch 'assets/index-') {
            Write-Error "产物未内嵌前端资源（开发模式）。裸 cargo build 缺 --features custom-protocol，拒绝发布。"
            exit 1
          }
          # 防"前端没重建就打旧包"：exe 内嵌的 bundle 必须就是当前 dist 里的那个。
          $js = Get-ChildItem "dist/assets" -Filter "index-*.js" | Select-Object -First 1
          if (-not $js) { Write-Error "dist/assets 找不到前端 bundle，请先 npm run build"; exit 1 }
          if ($text -notmatch [regex]::Escape($js.Name)) {
            Write-Error "exe 内嵌的不是当前 dist 产物($($js.Name))，前端与二进制版本错配，拒绝发布。"
            exit 1
          }
          # 注意：devUrl(端口) 在 dev/prod 两种构建下都会被写进内嵌配置，
          # 因此端口字符串**不能**作为 dev/prod 的判据，只有资产清单可靠。
          Write-Host "校验通过：已内嵌 $(( Get-ChildItem 'dist/assets' -Filter 'index-*' | Measure-Object).Count) 个当前 dist 资源（生产模式）"

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: mincal-windows-installer-unsigned
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 交付打包。签名是「有则更好」，不是「没配就失败」：
  #   配了 secrets  -> 逐个签名 + 强制验签，验不过直接拦下（真错误必须拦）。
  #   没配 secrets  -> 照常出包，只是未签名，并在 Release 正文里明确写清楚，
  #                    同时给出 sha256 供人工校验完整性。
  # 目的：任何时候都能打出可用的包，不被证书卡住。
  package:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PFX_B64: ${{ secrets.MINCAL_CODESIGN_PFX_BASE64 }}
      PFX_PASS: ${{ secrets.MINCAL_CODESIGN_PASSWORD }}
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: mincal-windows-installer-unsigned
          path: unsigned

      # 只有在真要签名时才装工具：没配证书就不碰 apt，
      # 避免 apt 镜像抖动把「本来能出包」的 job 弄红。
      # 注：配了证书时，工具装不上/签名失败会**明确报错**而不是偷偷降级为未签名，
      # 因为你显式要签名，拿到未签名包更该被发现并修掉。
      - name: Install osslsigncode
        if: env.PFX_B64 != '' && env.PFX_PASS != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends osslsigncode
          osslsigncode version 2>/dev/null || osslsigncode --version 2>&1 | head -1

      - name: Package (sign when credentials exist)
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(unsigned/*.exe)
          if [ ${#exes[@]} -eq 0 ]; then echo "::error::unsigned/ 下没有安装包"; exit 1; fi
          mkdir -p out
          SIGNED=no

          if [ -n "${PFX_B64:-}" ] && [ -n "${PFX_PASS:-}" ]; then
            WORK="$(mktemp -d)"
            trap 'rm -rf "$WORK"' EXIT
            # 清洗空白，兼容带/不带换行的 base64
            printf '%s' "$PFX_B64" | tr -d ' \n\r\t' | base64 -d > "$WORK/mincal-cs.pfx"
            chmod 600 "$WORK/mincal-cs.pfx"
            for f in "${exes[@]}"; do
              base="$(basename "$f")"
              echo "==> 签名 $base"
              ok=""
              for ts in http://timestamp.digicert.com http://timestamp.sectigo.com; do
                if osslsigncode sign -pkcs12 "$WORK/mincal-cs.pfx" -pass "$PFX_PASS" \
                     -n "MinCal" -i "https://github.com/JasonWod/MinCal" \
                     -ts "$ts" -in "$f" -out "out/$base" 2>/dev/null; then
                  ok="yes"; echo "    已签名（时间戳源 $ts）"; break
                fi
                echo "    时间戳源 $ts 不可用，换下一个"
              done
              if [ -z "$ok" ]; then
                echo "    ! 无可用时间戳源，改为不带时间戳签名"
                osslsigncode sign -pkcs12 "$WORK/mincal-cs.pfx" -pass "$PFX_PASS" \
                  -n "MinCal" -i "https://github.com/JasonWod/MinCal" \
                  -in "$f" -out "out/$base"
              fi
              # 真签了就必须验得过，否则是真错误，拦下
              osslsigncode verify "out/$base"
              echo "    验签通过"
            done
            SIGNED=yes
          else
            echo "::warning::未配置 MINCAL_CODESIGN_PFX_BASE64 / MINCAL_CODESIGN_PASSWORD，本次出未签名包（可正常使用）"
            cp "${exes[@]}" out/
          fi

          {
            echo "**签名状态：$([ "$SIGNED" = yes ] && echo '已签名（自签名证书）' || echo '未签名')**"
            echo
            if [ "$SIGNED" != yes ]; then
              echo "首次运行若被 SmartScreen 拦下：点 **「更多信息」→「仍要运行」** 即可。"
              echo "想要免提示：到仓库 Settings → Secrets 配上"
              echo "\`MINCAL_CODESIGN_PFX_BASE64\` 与 \`MINCAL_CODESIGN_PASSWORD\` 后重新发版。"
              echo
            fi
            echo "完整性校验 sha256："
            echo
            echo '```'
            ( cd out && sha256sum *.exe )
            echo '```'
          } > "$GITHUB_WORKSPACE/RELEASE_BODY.md"

          echo "=== 产物 ==="; ls -la out
          echo "=== Release 正文 ==="; cat "$GITHUB_WORKSPACE/RELEASE_BODY.md"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mincal-windows-installer
          path: out/*.exe
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.exe
          body_path: RELEASE_BODY.md
          fail_on_unmatched_files: true
